#!/usr/bin/env bash
# env.conf — shared configuration for the CS 1.6 ReHLDS installer.
# Sourced by bootstrap-root.sh, install-server.sh, wrapper-update.sh, lib/*.sh.
#
# This file is meant to be edited by the operator BEFORE running any script.
# It is the single source of truth for names/paths so both the root phase
# and the csserver-user phase agree on what they're operating on.
#
# If you already have a fresh VPS set up your own way (existing user,
# existing firewall policy, etc.), point the SERVICE_USER / paths below at
# what you already have and skip bootstrap-root.sh entirely — see README.

# ── Identity ──────────────────────────────────────────────────────────────
SERVICE_USER="csserver"                 # unix user LinuxGSM/the game server runs as
SERVICE_HOME="/home/${SERVICE_USER}"    # home dir == LinuxGSM root
LGSM_SERVER_NAME="csserver"             # LinuxGSM short-name (do not change: fixed by LGSM for CS1.6)

# ── OS / target ───────────────────────────────────────────────────────────
TARGET_OS="ubuntu2404"                    # informational only, for your own tracking — the
                                         # scripts self-detect the live OS at runtime and
                                         # don't read this value
REQUIRE_I386_MULTIARCH="yes"

# ── Network / firewall ────────────────────────────────────────────────────
GAME_PORT_UDP="27015"
RCON_PORT_TCP="27015"
CLIENT_PORT_UDP="27005"
HLTV_PORT_UDP="27020"
VAC_PORT_UDP="26900"
SSH_PORT="22"                            # Only used for the opt-in "avoid lockout" ufw check right
                                         # before enabling ufw — never assumed or applied automatically.
                                         # Change if you use a non-default SSH port.
ADMIN_IP=""                              # OPTIONAL. If set, RCON (tcp) is opened to this IP only.
                                         # If left blank, the RCON port is simply not opened by the
                                         # firewall step — set this later and re-run to enable remote RCON.

# ── SteamCMD / LinuxGSM branch pin ───────────────────────────────────────
STEAM_APPID="90"
STEAM_APPIDMOD="cstrike"
STEAM_BRANCH="steam_legacy"             # NOTE: no "-beta " prefix — LinuxGSM adds it automatically

# ── ReHLDS / GPG ──────────────────────────────────────────────────────────
REHLDS_GPG_KEY_ID="63547829004f07716f7be4856c32c4282e60fb67"
REHLDS_GPG_KEYSERVER="keyserver.ubuntu.com"
REHLDS_RELEASES_API="https://api.github.com/repos/rehlds/ReHLDS/releases"
REHLDS_PINNED_TAG="3.15.0.896"
# Confirmed real asset name (single combined zip, ships both bin/linux32 and
# bin/win32 — we extract linux32 only). Signature file is this + ".asc".
REHLDS_ASSET_REGEX="^rehlds-bin-[0-9.]+\.zip$"

# OPTIONAL: a GitHub personal access token (no scopes needed for public
# repos) to raise the unauthenticated API rate limit (60 req/hour/IP) when
# checking for newer releases. Only used for the api.github.com "latest
# release" lookup, never sent anywhere else. Leave blank if you don't have
# one — the installer just skips the "is a newer version out" check on
# rate-limit and continues with the pinned version.
GITHUB_TOKEN=""

# ── ReGameDLL_CS ────────────────────────────────────────────────────────
REGAMEDLL_RELEASES_API="https://api.github.com/repos/rehlds/ReGameDLL_CS/releases"
REGAMEDLL_PINNED_TAG="5.30.0.814"
REGAMEDLL_ASSET_REGEX="^regamedll-bin-[0-9.]+\.zip$"
# Although this release IS .asc-signed, no key is published in the repo's
# README/docs and it's not worth chasing down — treated as unsigned like the
# three below (gpg_download_unsigned: basic integrity check only, no crypto
# verification). Per upstream docs: install is just "replace cs.so" — we
# overlay bin/linux32/cstrike/* onto CSTRIKE_DIR (same as ReHLDS's pattern).

# ── ReAPI, Metamod-R, Reunion — NO GPG signatures available upstream ─────
# These three ship unsigned zips. We still download over HTTPS from GitHub
# and do a basic archive-integrity check (valid zip), but there is no
# cryptographic verification possible for these — called out clearly at
# install time and in the README, with links to the official source so the
# operator can check manually if they want.
REAPI_RELEASES_API="https://api.github.com/repos/rehlds/ReAPI/releases"
REAPI_PINNED_TAG="5.29.0.358"
REAPI_ASSET_REGEX="^reapi-bin-[0-9.]+\.zip$"
# Overlay addons/amxmodx/* onto CSTRIKE_DIR/addons/amxmodx/*. Loaded as an
# AMX Mod X module — actual modules.ini registration happens once the
# (not-yet-implemented) AMX Mod X step exists.

METAMOD_R_RELEASES_API="https://api.github.com/repos/rehlds/Metamod-R/releases"
METAMOD_R_PINNED_TAG="1.3.0.149"
METAMOD_R_ASSET_REGEX="^metamod-bin-[0-9.]+\.zip$"
# Overlay addons/metamod/* onto CSTRIKE_DIR/addons/metamod/*, then edit
# liblist.gam: gamedll_linux -> "addons/metamod/metamod_i386.so". Metamod-R
# auto-detects the real gamedll (cs.so) via its own internal mod-name table
# as long as ReGameDLL_CS's cs.so is at the conventional dlls/cs.so path —
# no config.ini edit needed.

REUNION_RELEASES_API="https://api.github.com/repos/rehlds/ReUnion/releases"
REUNION_PINNED_TAG="0.2.0.25"
REUNION_ASSET_REGEX="^reunion-[0-9.]+\.zip$"
# Per Reunion's own README: mkdir CSTRIKE_DIR/addons/reunion, copy
# bin/Linux/reunion_mm_i386.so there, prepend
# "linux addons/reunion/reunion_mm_i386.so" to
# CSTRIKE_DIR/addons/metamod/plugins.ini, copy reunion.cfg to CSTRIKE_DIR.

# AMX Mod X — confirmed a real GitHub release (not amxmodx.org's build
# server as previously assumed). Same pattern as the others: unsigned
# download, overlay addons/amxmodx/* onto CSTRIKE_DIR, then register in
# plugins.ini: "linux addons/amxmodx/dlls/amxmodx_mm_i386.so" (create the
# file if it doesn't exist yet).
AMXMODX_RELEASES_API="https://api.github.com/repos/alliedmodders/amxmodx/releases"
AMXMODX_PINNED_TAG="1.10.0.5481"
AMXMODX_ASSET_REGEX="^amxmodx-[0-9.]+-git[0-9]+-base-linux\.tar\.gz$"

# ── Component toggles (defaults for --unattended; interactive mode always prompts) ─
INSTALL_REGAMEDLL="yes"
INSTALL_REUNION="yes"
INSTALL_HARDENED_IPTABLES="no"          # EXPERIMENTAL — see README before enabling

# ── Hardening cvar defaults (written to server.cfg only after explicit confirmation) ─
CVAR_MAXCLIENTS_FROM_SINGLE_IP="5"
CVAR_MOVECMDRATE_MAX_AVG="400"
CVAR_MOVECMDRATE_AVG_PUNISH="5"
CVAR_MOVECMDRATE_MAX_BURST="2500"
CVAR_MOVECMDRATE_BURST_PUNISH="5"
CVAR_STRINGCMDRATE_MAX_AVG="80"
CVAR_STRINGCMDRATE_AVG_PUNISH="5"
CVAR_STRINGCMDRATE_MAX_BURST="400"
CVAR_STRINGCMDRATE_BURST_PUNISH="5"
# sv_rehlds_force_dlmax has no default here — always asked as its own y/n at install time

# ── Update-safety wrapper ─────────────────────────────────────────────────
REMOVE_LGSM_UPDATE_CRON="yes"           # still asked as y/n at install time regardless of this default
# The wrapper is deployed with its own copy of env.conf alongside it (cron
# runs from no particular directory, so it needs everything self-contained
# here rather than sourcing back to wherever the installer was originally run from).
WRAPPER_INSTALL_DIR="${SERVICE_HOME}/.cs16-installer"
WRAPPER_INSTALL_PATH="${WRAPPER_INSTALL_DIR}/wrapper-update.sh"
WRAPPER_CRON_SCHEDULE="*/30 * * * *"    # matches LinuxGSM's own documented recommended cadence for `update`
BINARY_VAULT_DIR="${SERVICE_HOME}/.rehlds-vault"   # pristine verified copies live here, outside serverfiles

# ── Paths derived from the above (do not normally need editing) ──────────
SERVERFILES_DIR="${SERVICE_HOME}/serverfiles"
CSTRIKE_DIR="${SERVERFILES_DIR}/cstrike"